# Frame Foundry - Netlify config
[build]
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Friendly API paths for the site's scripts
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/data/*"
  [headers.values]
    X-Robots-Tag = "noindex"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"
